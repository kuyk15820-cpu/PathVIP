name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: show xcode version
        run: xcodebuild -version

      - name: install ldid
        run: brew install ldid

      - name: sync swift files to xcodeproj
        run: |
          gem install xcodeproj
          ruby -e "
            require 'xcodeproj'
            
            project_path = Dir.glob('*.xcodeproj').first
            unless project_path
              puts 'No .xcodeproj found'
              exit 1
            end

            project = Xcodeproj::Project.open(project_path)
            target = project.targets.first

            Dir.glob('**/*.swift').each do |swift_file|
              next if swift_file.start_with?('Pods/', 'Build/', '.build/', 'DerivedData/')
              
              # ใช้ new_file เพื่อรับประกันว่า file_ref.path ไม่เป็น nil
              file_ref = project.main_group.new_file(swift_file)
              
              unless target.source_build_phase.files_references.include?(file_ref)
                target.source_build_phase.add_file_reference(file_ref)
                puts \"Added to project: #{swift_file}\"
              end
            end

            project.save
          "

      - name: build
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: upload artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: |
            build/*.ipa

      - name: upload release ipa
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: build/*.ipa


  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: download ipa
        uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: build/

      - name: get last 12h commits
        run: |
          COMMITS=$(git log --since="12 hours ago" --pretty=format:"- %h %s (%an)")
          if [ -z "$COMMITS" ]; then
            COMMITS="no commits in the last 12 hours"
          fi

          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: write release notes
        run: |
          cat <<EOF > release_notes.txt
          Nightly build
          
          Last 12 hours commits:
          
          ${COMMITS}
          EOF

      - name: update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
          gh release create nightly \
            --title "Nightly" \
            --notes "initial nightly" \
            --prerelease
      
          gh release edit nightly \
            --title "Nightly" \
            --notes-file release_notes.txt \
            --prerelease      
          
          for asset in $(gh release view nightly --json assets -q '.assets[].name'); do
            echo "Deleting old asset: $asset"
            gh release delete-asset nightly "$asset" -y || true
          done

          gh release upload nightly build/*.ipa --clobber
